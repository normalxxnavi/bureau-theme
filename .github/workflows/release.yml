# Release: el único workflow del repositorio.
#
# Subir commits (a develop o a release) no ejecuta nada. Todo empieza al subir
# un tag vX.Y.Z que esté en la rama release (ver CONTRIBUTING.md):
#
#   1. «build» y «integration» (automáticos, solo lectura): comprueban que el
#      tag está en release y coincide con package.json, las dependencias
#      (firmas y vulnerabilidades), los archivos generados, los tests y el test
#      de integración en un VS Code real; empaquetan el .vsix y su SHA-256.
#   2. «publish» espera tu aprobación (entorno «release» con Normalxxnavi como
#      revisor obligatorio): Actions → la ejecución → Review deployments →
#      Approve and deploy. «Reject» lo cancela y no se publica nada.
#   3. Al aprobarlo se publica la versión en el Marketplace de VS Code, se
#      firma la procedencia del .vsix y se crea la release de GitHub con el
#      .vsix y su SHA-256.
#
# Candidatas: un tag vX.Y.Z.rc-N (en develop o en release) pasa «build» e
# «integration» igual que una versión, con el .vsix en los artefactos de la
# ejecución, pero «publish» no se ejecuta: así se prueba todo sin publicar.
#
# Publicación en el Marketplace sin secretos: Microsoft Entra ID con OIDC. GitHub
# da al trabajo aprobado un token de corta duración que una app de Entra ID
# acepta gracias a su credencial federada (repo:normalxxnavi@123770217/bureau-theme@1416781499,
# entorno release); esa app es miembro del publisher (vsce --azure-credential).
# Solo hacen falta las variables AZURE_CLIENT_ID y AZURE_TENANT_ID del entorno
# release. Configuración paso a paso en CONTRIBUTING.md.
#
# El certificado de procedencia se verifica con
#   gh attestation verify bureau-theme-X.Y.Z.vsix --repo Normalxxnavi/bureau-theme
#
# Las acciones van fijadas por el SHA de su commit (el comentario dice la
# versión): una etiqueta se puede mover y colar otro código; un SHA no.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # Cada trabajo y cada paso largo tiene su límite de tiempo: algo que se queda
  # colgado falla en minutos, no a las 6 horas (el límite de GitHub).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # VERSION (sin la «v» ni el «.rc-N») y RC (true en una candidata) para los demás pasos.
      - name: Tag is a version (vX.Y.Z) or a release candidate (vX.Y.Z.rc-N)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(\.rc-[0-9]+)?$ ]]; then
            echo "::error::$TAG is neither vX.Y.Z nor vX.Y.Z.rc-N."
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          if [ -n "${BASH_REMATCH[2]}" ]; then echo "RC=true" >> "$GITHUB_ENV"; else echo "RC=false" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historial completo para comprobar la rama del tag
      # Una versión sale de release; una candidata también se puede probar desde develop.
      - name: Tag is on the release branch (a release candidate may also be on develop)
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/release; then exit 0; fi
          if [ "$RC" = true ] && git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then exit 0; fi
          echo "::error::$GITHUB_REF_NAME is not on the release branch. Merge develop into release and tag the release branch (a release candidate vX.Y.Z.rc-N may also be on develop)."
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación de terceros (esbuild trae su binario como dependencia opcional).
      - run: npm ci --ignore-scripts
      - name: Dependencies are signed by the registry and have no known vulnerabilities
        run: |
          npm audit signatures
          npm audit --audit-level=moderate
      - name: Tag matches package.json
        run: test "$(node -p "require('./package.json').version")" = "$VERSION"
      # Hasta la 1.0.0: 0.<intento>.<intento><DDMMAAAA> (scripts/version.js).
      - name: Version follows the beta scheme
        run: node scripts/version.js --check "$VERSION"
      - run: npm run check
      - name: Generated files are up to date
        run: |
          npm run generate
          git diff --exit-code -- themes icons product-icons fonts/prompt media package.json
      # Las imágenes y enlaces del README apuntan a ESTE tag, no a la rama por defecto:
      # así cambiar o borrar una captura más adelante no rompe la página de una
      # versión ya publicada (el Marketplace y VS Code las leen de GitHub).
      - name: Package
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}"
          npx vsce package --out "bureau-theme-${GITHUB_REF_NAME#v}.vsix" --baseImagesUrl "$base/raw/$GITHUB_REF_NAME/" --baseContentUrl "$base/blob/$GITHUB_REF_NAME/"
      - run: sha256sum bureau-theme-*.vsix > SHA256SUMS.txt
      - run: node scripts/release-notes.js "$VERSION" > release-notes.md
      - name: Summary
        run: |
          {
            if [ "$RC" = true ]; then
              echo "### Release candidate $GITHUB_REF_NAME"
              echo
              echo "Nothing is published: the checks and the integration test run as for a release, and the .vsix is in the artifacts of this run. To publish $VERSION, push the tag v$VERSION on release."
            else
              echo "### Release $GITHUB_REF_NAME ready for review"
              echo
              echo "Approve the **publish** job to publish it on the VS Code Marketplace and create the GitHub release."
            fi
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            bureau-theme-*.vsix
            SHA256SUMS.txt
            release-notes.md
          retention-days: 7

  # Windows, macOS y Linux: los tests unitarios y el test de integración en un
  # VS Code real (sonidos con el reproductor de cada sistema, tipografías en la
  # carpeta de fuentes de cada sistema, terminal, depurador, Git…). Además, el
  # test de integración en la versión más antigua que admite package.json
  # (engines.vscode), en Windows: Cursor, Windsurf y VSCodium van por detrás.
  integration:
    name: Integration test in VS Code (${{ matrix.os }}${{ matrix.vscode == 'minimum' && ', oldest supported version' || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        vscode: [stable]
        include:
          - os: windows-latest
            vscode: minimum
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Los tests de la terminal Bureau dibujan el prompt en cada shell que haya:
      # en Linux se instalan zsh y fish (macOS trae zsh; Windows, Git Bash y PowerShell).
      - name: zsh and fish for the terminal prompt tests
        if: runner.os == 'Linux' && matrix.vscode == 'stable'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends zsh fish
      - run: npm test
        if: matrix.vscode == 'stable'
      # Linux: pantalla virtual (xvfb) y un servidor de sonido sin tarjeta (PulseAudio
      # con una salida nula), para que paplay reproduzca de verdad.
      - name: Linux display and audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends xvfb pulseaudio pulseaudio-utils fontconfig
          # Sin servidor de sonido paplay falla al reproducir, pero el test sigue
          # comprobando que cada evento lanza el reproductor: no es un error.
          pulseaudio --start --exit-idle-time=-1 || echo "::warning::PulseAudio did not start"
          pactl load-module module-null-sink sink_name=bureau || true
      # La gramola contra el sistema de verdad (scripts/jukebox-check.js). Linux:
      # un reproductor de prueba (mpv con MPRIS, en un D-Bus propio) con el que se
      # comprueban la canción, la portada, pausar y reanudar. macOS: los AppleScript
      # compilan con el diccionario real de Música. Windows: el PowerShell lee la
      # sesión multimedia sin fallar.
      - name: Songmaster jukebox against the system
        if: matrix.vscode == 'stable'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -yq --no-install-recommends dbus libglib2.0-bin mpv mpv-mpris ffmpeg
            npm run test:jukebox -- --test-player
          else
            npm run test:jukebox
          fi
      - name: Download VS Code (${{ matrix.vscode }})
        shell: bash
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
        run: |
          if [ "$VSCODE_VERSION" = minimum ]; then VSCODE_VERSION=$(node -p "require('./package.json').engines.vscode.replace(/^\^/, '')"); fi
          npm run download-vscode -- "$VSCODE_VERSION"
      # Todos los lenguajes de VS Code tienen muestra y ningún token se queda sin
      # color (con las gramáticas del VS Code recién descargado).
      - name: Every language sample is fully coloured
        if: runner.os == 'Linux'
        run: npm run preview -- --check
      # El test maneja un VS Code real con tiempos límite (servidor de TypeScript,
      # depurador, sonidos): en un runner lento puede fallar sin motivo. Se repite
      # una vez; un fallo real falla las dos veces.
      - name: Integration test (one retry)
        timeout-minutes: 12
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:integration; else npm run test:integration; fi; }
          run && exit 0
          echo "::warning::Integration test failed on the first attempt; retrying once."
          run
      # Los popups con diseño en el VS Code de cada sistema (scripts/popup-check.js):
      # el ratón, virtual, sobre la Casa Inmemorial y, en Linux, sobre la gramola con
      # el reproductor de prueba. Las capturas quedan en los artefactos del run.
      - name: Popups in a real VS Code
        if: matrix.vscode == 'stable'
        timeout-minutes: 8
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:popups -- --test-player
          else
            npm run test:popups
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.vscode == 'stable'
        with:
          name: popups-${{ runner.os }}
          path: .popup-check/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # Una candidata (vX.Y.Z.rc-N) nunca se publica.
    if: ${{ !contains(github.ref_name, '.rc-') }}
    needs: [build, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Revisor obligatorio: el trabajo espera aquí hasta que lo apruebes. La
    # credencial federada de Entra ID solo acepta trabajos de este entorno.
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=Normalxxnavi.bureau-theme
    permissions:
      contents: write # crear la release de GitHub
      id-token: write # firmar la procedencia y entrar en Microsoft Entra ID (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # vsce con la versión exacta del package-lock.json (con su suma de integridad).
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/bureau-theme-*.vsix
      - name: Microsoft Entra ID is configured
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ]; then
            echo "::error::Add the AZURE_CLIENT_ID and AZURE_TENANT_ID variables to the release environment (Settings → Environments → release). See CONTRIBUTING.md."
            exit 1
          fi
      - name: Sign in to Microsoft Entra ID (OIDC, no secrets)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # El ID que hay que añadir como miembro del publisher (la primera vez).
      - name: Marketplace identity
        run: |
          profile=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "Marketplace profile ID of the Entra ID app: $profile"
          echo "Marketplace profile ID of the Entra ID app: \`$profile\`" >> "$GITHUB_STEP_SUMMARY"
      - name: The identity can publish for the publisher
        run: |
          publisher=$(node -p "require('./package.json').publisher")
          if ! npx vsce verify-pat "$publisher" --azure-credential; then
            echo "::error::The Entra ID app is not a member of the $publisher publisher yet. Open https://marketplace.visualstudio.com/manage/publishers/$publisher → Members → Add, paste the profile ID from the 'Marketplace identity' step, choose the Contributor role, then re-run the failed job."
            exit 1
          fi
      - name: Publish to the VS Code Marketplace
        run: |
          # --skip-duplicate: si se repite el trabajo, una versión ya publicada no es un error.
          npx vsce publish --packagePath "$(ls out/bureau-theme-*.vsix)" --azure-credential --skip-duplicate
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The GitHub release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/bureau-theme-*.vsix out/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --notes-file out/release-notes.md $flags
