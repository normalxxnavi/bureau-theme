# Comprobaciones en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: la CI solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación de terceros (esbuild trae su binario como dependencia opcional).
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Generated files are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run generate
          git diff --exit-code -- themes icons product-icons package.json README.md
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --out bureau-theme.vsix
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bureau-theme-vsix
          path: bureau-theme.vsix
          retention-days: 14

  integration:
    name: Integration test in VS Code (windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run download-vscode
      - run: npm run test:integration
