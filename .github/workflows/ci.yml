# Comprobaciones de la rama de producción: en cada push a release y en cada pull
# request hacia release (develop → release). En develop no se lanzan solas; se
# pueden lanzar a mano desde Actions → CI → Run workflow.
#
# Las acciones van fijadas por el SHA de su commit (el comentario dice la
# versión): una etiqueta como «v7» se puede mover y colar otro código en la CI;
# un SHA no. Dependabot las actualiza.
name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

# Mínimo privilegio: la CI solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación de terceros (esbuild trae su binario como dependencia opcional).
      - run: npm ci --ignore-scripts
      - name: Dependencies are signed by the registry and have no known vulnerabilities
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm audit signatures
          npm audit --audit-level=moderate
      - run: npm run check
      - name: Generated files are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run generate
          git diff --exit-code -- themes icons product-icons package.json
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package --out bureau-theme.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: bureau-theme-vsix
          path: bureau-theme.vsix
          retention-days: 14

  integration:
    name: Integration test in VS Code (windows)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run download-vscode
      # El test maneja un VS Code real con tiempos límite (servidor de TypeScript,
      # depurador, sonidos): en un runner lento puede fallar sin motivo. Se repite
      # una vez; un fallo real falla las dos veces.
      - name: Integration test (one retry)
        shell: bash
        run: |
          npm run test:integration && exit 0
          echo "::warning::Integration test failed on the first attempt; retrying once."
          npm run test:integration
