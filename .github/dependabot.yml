# Actualizaciones semanales de dependencias (todas son de desarrollo: la
# extensión no lleva dependencias en tiempo de ejecución) y de las acciones de
# GitHub (fijadas por SHA). @types/vscode se mantiene en la versión mínima de
# `engines.vscode`.
#
# `cooldown`: no se propone una versión hasta que lleva 7 días publicada. Los
# paquetes secuestrados suelen detectarse y retirarse en ese plazo.
#
# Los pull requests van a develop: a release (producción) solo llega lo que se
# fusiona desde develop.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: '@types/vscode'
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
