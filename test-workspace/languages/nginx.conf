# Archivo de prueba del tema: nginx.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream bureau {
        server 127.0.0.1:8080 weight=3;
        server 127.0.0.1:8081 backup;
    }

    server {
        listen 443 ssl http2;
        server_name oldest-house.example.invalid;

        ssl_certificate     /etc/ssl/bureau.pem;
        add_header X-Sector "research" always;

        location / {
            proxy_pass http://bureau;
            proxy_set_header Host $host;
        }

        location ~* \.(png|svg)$ {
            expires 30d;
        }

        if ($request_method = POST) {
            return 405;
        }
    }
}
